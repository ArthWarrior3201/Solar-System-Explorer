<html>
  <head>
    <title>Solar System Explorer v2026.2</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <link rel="stylesheet" href="applab.css">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://code.jquery.com/jquery-1.12.1.min.js"></script>
    <script src="applab-api.js"></script>
    <script src="code.js"></script>
  </head>
  <body>
    <div id="divApplab" class="appModern running" style="width: 320px; height: 450px; display: block;">
      <div class="screen" id="screenlogin" style="height: 450px; width: 320px; background-color: black; position: absolute;">
         </div>
    </div>

    <script>
      function fitToScreen() {
        var app = document.getElementById('divApplab');
        var scale = Math.min(window.innerWidth / 320, window.innerHeight / 450);
        app.style.transform = 'scale(' + scale + ')';
        app.style.transformOrigin = 'center center';
      }
      window.addEventListener('load', fitToScreen);
      window.addEventListener('resize', fitToScreen);
    </script>
  </body>
</html>
